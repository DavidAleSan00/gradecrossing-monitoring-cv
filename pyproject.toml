[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "usdot-gradecrossing-monitoring"
version = "0.4.0"
description = "Grade-crossing hazard monitoring with computer vision (YOLO + BoT-SORT + MOG2)"
requires-python = ">=3.9"
dependencies = [
    "opencv-python==4.13.0.92",
    "numpy==2.0.2",
    "ultralytics==8.4.78",
    "lap==0.5.13",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
    "jupyter",
    "ipykernel",
    "matplotlib",
    "pytest==8.4.2",
    "ruff==0.15.22",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pipeline*"]

[tool.setuptools.package-data]
"pipeline.perception.tracking" = ["botsort.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires real video clips and model weights; use --require-integration-assets for release audits",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
