[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "usdot-gradecrossing-monitoring"
version = "0.4.0"
description = "Grade-crossing hazard monitoring with computer vision (YOLO + BoT-SORT + MOG2)"
requires-python = ">=3.9"
# numpy/opencv are ranges, not exact pins, because the supported platforms
# need different exact versions: numpy==2.0.2 / opencv-python==4.13.0.92 on
# Mac/Raspberry Pi, numpy==1.26.4 / opencv-python==4.11.0.86 on the NVIDIA
# Jetson Orin Nano (to match its JetPack-provided PyTorch — see
# constraints-jetson.txt and README.md "TensorRT runtime comparison"). Pin
# the exact version actually installed with `-c constraints-mac-pi.txt` or
# `-c constraints-jetson.txt` so the range below doesn't just resolve to
# "whatever's newest" — see those files and README.md "Quick Start".
dependencies = [
    "opencv-python>=4.11.0.86,<4.14",
    "numpy>=1.26.4,<2.1",
    "ultralytics==8.4.78",
    "lap==0.5.13",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
    "jupyter",
    "ipykernel",
    "matplotlib",
    "pytest==8.4.2",
    "ruff==0.15.22",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pipeline*"]

[tool.setuptools.package-data]
"pipeline.perception.tracking" = ["botsort.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests", "validation"]
markers = [
    "integration: requires real video clips and model weights; use --require-integration-assets for release audits",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
