# Invariant: project-owned values prevent Ultralytics upgrades from silently
# changing tracking behavior.
# Camera stabilization is handled by stabilization/core.py.
# Performance: appearance ReID stays disabled until its cost is validated.
tracker_type: botsort
track_high_thresh: 0.25
track_low_thresh: 0.10
new_track_thresh: 0.25
track_buffer: 30
match_thresh: 0.80
fuse_score: true
gmc_method: none
proximity_thresh: 0.50
appearance_thresh: 0.80
with_reid: false
model: auto
